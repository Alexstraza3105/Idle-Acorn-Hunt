<script>
const $=id=>document.getElementById(id),KEY='acornhunt2',HUNT=300000,UNL=25000,PMAX=12;
const AC=g=>{const b=g?'#f5c02a':'#b9793b',c=g?'#b8800a':'#5b3a1e';return `<svg viewBox="0 0 24 24" width="1.1em" height="1.1em" style="vertical-align:-.2em" aria-hidden="true"><rect x="11" y="2.5" width="2" height="4.5" rx="1" fill="${c}"/><path d="M12 22.5c-4.2 0-6.7-3.6-6.7-8.2h13.4c0 4.6-2.5 8.2-6.7 8.2z" fill="${b}"/><path d="M4.3 14c0-4.7 3.4-7.5 7.7-7.5s7.7 2.8 7.7 7.5z" fill="${c}"/>${g?'<path d="M8.5 16.5c.3 1.6 1.3 2.9 2.6 3.5" stroke="#fff3b8" stroke-width="1.4" fill="none" stroke-linecap="round"/>':''}</svg>`};
const U=[{id:'claws',n:'Sharp Claws',d:'+50% acorns per hunt',e:'🐾',c:150,g:1.8,max:99},{id:'soil',n:'Rich Soil',d:'+25% harvest yield',e:'🪱',c:300,g:1.9,max:99},{id:'burrow',n:'Deeper Burrow',d:'+1 stored hunt',e:'🕳️',c:300,g:1.9,max:7},{id:'nose',n:'Sharp Nose',d:'+0.1% special find chance',e:'👃',c:800,g:2,max:10},{id:'whisk',n:'Lucky Whiskers',d:'+0.5% golden acorn chance',e:'✨',c:500,g:1.8,max:10},{id:'store',n:'Bigger Cheeks',d:'Doubles acorn storage',e:'🐿️',c:2000,g:2.2,max:99}];
const SP=[{id:'oak',n:'Oak Charm',e:'🌳',d:n=>'+'+5*n+'% harvest yield'},{id:'feather',n:"Hunter's Feather",e:'🪶',d:n=>'+'+5*n+'% acorns per hunt'},{id:'clover',n:'Four-leaf Clover',e:'🍀',d:n=>'+'+0.5*n+'% golden acorn chance'},{id:'satchel',n:'Seed Satchel',e:'🧺',d:n=>'+'+n+'% seed drop chance'}];
const G=[{id:'sack',n:'Acorn Sack',d:d=>'Instantly get '+fmt(Math.round(S.cap*.5))+' acorns',e:'🎒',c:3},{id:'tonic',n:'Miracle Grow',d:'Every growing plot advances 5 hunts',e:'🧪',c:2},{id:'pouch',n:'Trinket Pouch',d:'+5 stack limit on every special find',e:'👜',c:5}];
const PU=[{id:'keen',n:'Keen Nose',e:'👃',d:'+0.25% special find chance',max:10,c:l=>3+2*l},{id:'luck',n:'Golden Instinct',e:'💫',d:'+0.25% golden acorn chance',max:8,c:l=>4+2*l},{id:'farm',n:'Farmhand',e:'🧑‍🌾',d:'Acorn seeds grow 1 hunt faster (min 5)',max:7,c:l=>2*(l+1)},{id:'gfarm',n:'Golden Farmhand',e:'👩‍🌾',d:'Golden seeds grow 3 hunts faster (min 15)',max:5,c:l=>3*(l+1)},{id:'mkt',n:'Skin Market',e:'🏪',d:'Unlocks colour skins in the golden shop',max:1,c:l=>5}];
const SK=[{id:'',n:'Forest',e:'🌲'},{id:'autumn',n:'Autumn',e:'🍁'},{id:'frost',n:'Frost',e:'❄️'},{id:'plum',n:'Plum',e:'🫐'}];
const def=()=>({a:0,g:0,hc:1,ht:Date.now(),pf:{name:'',av:'red'},ach:{},col:{},cap:5000,run:0,seed:1,gseed:0,plots:[null],up:{},sp:{oak:0,feather:0,clover:0,satchel:0},slot:0,mus:0,vol:50,T:{since:Date.now(),time:0,earned:0,hunts:0,seeds:0,gseeds:0,harv:0,gfound:0,sp:{oak:0,feather:0,clover:0,satchel:0}},P:{hw:0,n:0,lv:{}},skins:[''],skin:'',lastVer:'',theme:''});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=def()}
for(const k in S.sp)if(S.T.sp[k]<S.sp[k])S.T.sp[k]=S.sp[k];S.T.earned=Math.max(S.T.earned,S.run);if(!S.T.since)S.T.since=Date.now();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fmt=n=>{n=Math.floor(n);return n>=1e6?(n/1e6).toFixed(2)+'M':n.toLocaleString()};
const lv=id=>S.up[id]||0,pl=id=>S.P.lv[id]||0,lim=()=>5+5*S.slot;
const need=k=>k=='g'?Math.max(15,30-3*pl('gfarm')):Math.max(5,12-pl('farm'));
const yld=()=>Math.round(150*(1+.05*S.sp.oak)*(1+.25*lv('soil'))*(1+ab('yield')));
const uc=u=>u.id=='store'?S.cap:Math.ceil(u.c*Math.pow(u.g,lv(u.id))),pc=()=>Math.ceil(200*Math.pow(3,S.plots.length-1));
const gcst=x=>x.id=='pouch'?5*(S.slot+1):x.c,pgain=()=>Math.floor(Math.sqrt(S.run/1000)*(1+ab('heart')));
function toast(t){$('msg').innerHTML=t}
function gain(n){n=Math.floor(n);const t=Math.max(0,Math.min(n,S.cap-S.a));S.a+=t;S.run+=t;S.T.earned+=t;return t}
function hunt(){
 accrue();if(S.hc<1)return;S.hc--;S.T.hunts++;
 const m=1+.5*lv('claws')+.05*S.sp.feather+ab('hauls'),gc=.03+.005*lv('whisk')+.005*S.sp.clover+.0025*pl('luck')+ab('gold'),r=Math.random();let msg,n=0;
 if(r<gc){S.g++;S.T.gfound++;msg=AC(1)+' A golden acorn glinting in the roots!'}
 else if(r<gc+.25){n=Math.round((25+Math.random()*25)*m);msg='🍂 Big stash: +'+fmt(n)+' acorns!'}
 else{n=Math.round((5+Math.random()*10)*m);msg=AC()+' Dug up +'+fmt(n)+' acorns'}
 if(n&&gain(n)<n)msg+=' (storage full!)';
 if(Math.random()<.1+.01*S.sp.satchel+ab('seed')){const k=1+Math.floor(Math.random()*3);S.seed+=k;S.T.seeds+=k;msg+='<br>🌱 Found '+k+' seed'+(k>1?'s':'')+'!'}
 if(Math.random()<.05+ab('gseed')){S.gseed++;S.T.gseeds++;msg+='<br>'+AC(1)+'🌱 Found a golden seed!'}
 if(Math.random()<.01+.0025*pl('keen')+.001*lv('nose')+ab('special')){const o=SP.filter(x=>S.sp[x.id]<lim());if(o.length){const x=o[Math.floor(Math.random()*o.length)];S.sp[x.id]++;S.T.sp[x.id]++;msg+='<br>'+x.e+' <b>Special find: '+x.n+'!</b> '+x.d(S.sp[x.id])+' in total'}}
 S.plots.forEach(p=>{if(p&&p.h<need(p.k))p.h++});
 toast(msg);save();lists();ui()}
function plant(i,k){if(S.plots[i])return;if(k=='g'){if(!S.gseed)return;S.gseed--}else{if(!S.seed)return;S.seed--}S.plots[i]={k,h:0};lists();ui();save()}
function harvest(i){const p=S.plots[i];if(!p||p.h<need(p.k))return;
 if(p.k=='g'){S.g++;S.T.gfound++;toast(AC(1)+' Harvested a golden acorn!')}else{const n=yld();gain(n)<n?toast('🧺 Harvested +'+fmt(n)+' acorns (storage full!)'):toast('🧺 Harvested +'+fmt(n)+' acorns!')}

{k:'spec',n:'Special finds',v:()=>Object.values(S.T.sp).reduce((a,b)=>a+b,0),t:[[1,'Lucky Find','Find your first special item'],[5,'Trinket Hunter','Find 5 special items'],[20,'Treasure Keeper','Find 20 special items'],[50,'Relic Master','Find 50 special items']]},
{k:'coll',n:'Collection',v:()=>Object.values(S.T.sp).filter(x=>x>0).length,t:[[2,'Matching Pair','Find 2 different kinds of special item'],[4,'Complete Collection','Find all 4 kinds of special item']]},
{k:'time',n:'Time played',v:()=>S.T.time,f:ft,t:[[3600,'Settling In','Play for 1 hour'],[36000,'Regular Visitor','Play for 10 hours'],[360000,'Dedicated Squirrel','Play for 100 hours']]},
{k:'prof',n:'Profile',v:()=>S.pf.name?1:0,t:[[1,'Say Hello','Create your profile']]},
{k:'acct',n:'Account',v:()=>user?1:0,t:[[1,'Cloud Squirrel','Sign in to an online account']]}];
const CB={hunt:'hauls',acorn:'hauls',gold:'gold',harv:'yield',seed:'seed',gseed:'gseed',land:'yield',pres:'heart',spec:'special',coll:'special',time:'hauls',prof:'hauls',acct:'hauls'};
AG.forEach(c=>c.b=CB[c.k]);
const BN={hauls:{v:.005,t:'acorns per hunt'},yield:{v:.005,t:'harvest yield'},gold:{v:.001,t:'golden acorn chance'},seed:{v:.0025,t:'seed drop chance'},gseed:{v:.001,t:'golden seed chance'},special:{v:.0005,t:'special find chance'},heart:{v:.01,t:'Heartwood from prestige'}};
const pcf=x=>(+(x*100).toFixed(2))+'%',bl=b=>'+'+pcf(BN[b].v)+' '+BN[b].t;
function ab(t){let n=0;for(const c of AG)if(c.b==t)for(const x of c.t)if(S.ach[c.k+x[0]])n++;return n*BN[t].v}
const applyCol=()=>document.querySelectorAll('details.sec[data-s]').forEach(d=>{d.open=!S.col[d.dataset.s]});
let lbTab='acorns';
function lbTabSel(t){lbTab=t;document.querySelectorAll('.lbsel').forEach(s=>{if(s.value!==t)s.value=t});loadLB()}
async function loadLB(){const els=['lb','lb2'].map($).filter(Boolean);if(!els.length)return;
 if(!sb){els.forEach(e=>e.innerHTML='<div class="sub">Leaderboard unavailable</div>');return}
 els.forEach(e=>e.innerHTML='<div class="sub">Loading…</div>');
 const r=await sb.from('leaderboard').select('user_id,username,acorns,gold,prestige').order(lbTab,{ascending:false}).limit(20);
 if(r.error){els.forEach(e=>e.innerHTML='<div class="sub">Leaderboard unavailable</div>');return}
 const rows=r.data||[];
 const h=rows.length?rows.map((x,i)=>{const mine=!!(user&&x.user_id===user.id);return `<div class="row${mine?' me':''}"><span>${i+1}. ${esc(x.username||'Squirrel')}${mine?' (you)':''}</span><b>${fmt(x[lbTab])}</b></div>`}).join(''):'<div class="sub">No entries yet — be the first!</div>';
 els.forEach(e=>e.innerHTML=h)}
function secT(d){if(d.open){if(S.col[d.dataset.s]){delete S.col[d.dataset.s];save()}}else if(!S.col[d.dataset.s]){S.col[d.dataset.s]=1;save()}}
const ATOT=AG.reduce((a,c)=>a+c.t.length,0),opn=new Set(),fv=(c,x)=>c.f?c.f(x):fmt(x);
let bt;
function tg(k,o){o?opn.add(k):opn.delete(k)}
function banner(nw){$('ab').innerHTML=nw.length==1?`🏆 <b>${esc(nw[0][1])}</b><br><span class="sub">${esc(nw[0][2])}</span><br><span class="sub">Bonus: ${bl(nw[0][3])}</span>`:`🏆 <b>${nw.length} achievements unlocked!</b>`;$('ab').hidden=false;clearTimeout(bt);bt=setTimeout(()=>{$('ab').hidden=true},4500)}
function checkAch(){const now=Date.now(),nw=[];
 for(const c of AG){const v=c.v();for(const t of c.t){const id=c.k+t[0];if(!S.ach[id]&&v>=t[0]){S.ach[id]=now;nw.push([t[0],t[1],t[2],c.b])}}}
 if(nw.length){banner(nw);save();achList();lists()}}
function achList(){let got=0;
 $('al').innerHTML=AG.map(c=>{const v=c.v();let done=0,first=1;
  const rows=c.t.map(t=>{const d=!!S.ach[c.k+t[0]];if(d){got++;done++}
   const nx=!d&&first;if(!d)first=0;
   const pr=nx?`<div class="bar"><i style="width:${Math.min(100,100*v/t[0])}%"></i></div><small>${fv(c,Math.min(v,t[0]))} / ${fv(c,t[0])}</small>`:'';
   return `<div class="it" style="${d?'':'opacity:.65'}"><span class="em">${d?'🏆':'🔒'}</span><span class="tx"><b>${esc(t[1])}</b><small>${esc(t[2])}</small>${pr}</span></div>`}).join('');
  return `<details ${opn.has(c.k)?'open':''} ontoggle="tg('${c.k}',this.open)"><summary>${c.n} <span class="sub">${done}/${c.t.length}</span></summary><div class="sub" style="margin-bottom:4px">Each: ${bl(c.b)} · Now: +${pcf(done*BN[c.b].v)}</div>${rows}</details>`}).join('');
 $('ai').textContent=got+' of '+ATOT+' unlocked'}
const CHANGELOG=[
 {v:'2026-09-26c',t:'Dashboard & settings',items:['Leaderboard now sits under your stats on the right (desktop), with a dropdown instead of tabs','Your stats and leaderboard panels can now be collapsed','Your own row on the leaderboard is now outlined so you can spot it fast','Replaced "Edit profile" with a full Settings screen: change your username, password, email, or squirrel','Sound controls moved into Settings, under Audio','Added a Light / Dark / Auto background colour toggle in Settings']},
 {v:'2026-09-26b',t:'Feedback & announcements',items:['Added an in-game feedback button (bottom right) for gameplay notes, bugs, questions, and praise','Added a live announcement banner for game-wide notices','Farm plots are now compact square tiles, so more fit on screen','Acorn Sack now gives 50% of your current max storage instead of a flat amount']},
 {v:'2026-09-26',t:"What's new",items:['Deeper Burrow now stores up to 10 hunts at max level','Added a "What\'s new" changelog, right here!']},
 {v:'2026-09-25',t:'Leaderboard & unique names',items:['Added a live leaderboard with Acorns, Golden acorns and Prestige tabs','Usernames are now unique across all players','On wide screens the leaderboard now sits in the left column','New Sharp Nose upgrade for special find chance','Acorn Sack now gives 3,000 acorns instead of 5,000','Achievements moved below Prestige, and the ad banner now sits below the stats panel on mobile']},
 {v:'2026-09-24b',t:'Achievements & sound',items:['Added 41 tiered achievements, each giving a small permanent bonus','Sections can now be collapsed','Added background bird sounds with a volume toggle','Added online accounts, so progress can sync across devices','Added a personal stats panel and drop-chance odds under the Hunt button']},
 {v:'2026-09-24a',t:'Farming rework',items:['Replaced buildings with a farm: plant seeds, grow them over several hunts, then harvest','Added rare special finds with permanent stackable effects','Added prestige, which resets your run for permanent Heartwood upgrades','Storage cap is now purchased with acorns instead of golden acorns']}
];
function clHTML(list){return list.map(e=>`<h3 style="margin:14px 0 4px">${esc(e.t)} <span class="sub">· ${e.v}</span></h3><ul style="margin:0 0 4px 18px;padding:0">${e.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`).join('')}
function showChangelog(all){const list=all?CHANGELOG:CHANGELOG.filter(e=>!S.lastVer||e.v>S.lastVer);
 modal(`<h2 style="margin-top:0">What's new</h2>${clHTML(list.length?list:CHANGELOG.slice(0,1))}<button class="mini" style="margin-top:10px" onclick="closeModal()">Got it</button>`);
 S.lastVer=CHANGELOG[0].v;save()}
function openFeedback(){modal(`<h2 style="margin-top:0">Send feedback</h2>
<div class="sub" style="margin-bottom:6px">Type</div>
<select id="fbType" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit">
<option value="gameplay">Gameplay</option>
<option value="bug">Bug</option>
<option value="question">Question</option>
<option value="praise">Praise for the Almighty Alexstraza</option>
</select>
<div style="height:8px"></div>
<textarea id="fbMsg" rows="4" maxlength="2000" placeholder="Tell us what's on your mind…" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical"></textarea>
<div id="fbm" class="sub" style="margin:8px 0"></div>
<button class="mini" id="fbs" style="margin:0" onclick="sendFeedback()">Send</button>`)}
async function sendFeedback(){const t=$('fbType').value,m=$('fbMsg').value.trim();
 if(!m){$('fbm').style.color='var(--gold)';$('fbm').textContent='Write a message first.';return}
 if(!sb){$('fbm').style.color='var(--gold)';$('fbm').textContent='Feedback is unavailable right now.';return}
 $('fbs').disabled=true;$('fbm').style.color='var(--mute)';$('fbm').textContent='Sending…';
 const r=await sb.from('feedback').insert({user_id:user?user.id:null,username:S.pf.name||null,type:t,message:m.slice(0,2000)});
 if(r.error){$('fbm').style.color='var(--gold)';$('fbm').textContent='Could not send: '+r.error.message;$('fbs').disabled=false;return}
 closeModal();toast('💬 Thanks for the feedback!')}
let annId=null;
async function loadAnn(){if(!sb)return;
 const r=await sb.from('announcement').select('message,active,updated_at').eq('id',1).maybeSingle();
 if(r.error||!r.data||!r.data.active||!r.data.message){$('annb').hidden=true;return}
 const key='ann'+Date.parse(r.data.updated_at);
 let seen=null;try{seen=localStorage.getItem('acornhunt_ann')}catch(e){}
 if(seen===key){$('annb').hidden=true;return}
 annId=key;$('annt').textContent=r.data.message;$('annb').hidden=false}
function dismissAnn(){if(annId)try{localStorage.setItem('acornhunt_ann',annId)}catch(e){}
 $('annb').hidden=true}
function settingsHTML(tab){
 const tabs=[['profile','Profile'],['audio','Audio'],['gameplay','Gameplay']];
 const nav=tabs.map(([k,l])=>`<button class="mini${tab==k?' on':''}" style="margin:0 6px 10px 0" onclick="openSettings('${k}')">${l}</button>`).join('');
 const body=tab=='audio'?audioTabHTML():tab=='gameplay'?gameplayTabHTML():profileTabHTML();
 return `<h2 style="margin-top:0">Settings</h2><div>${nav}</div>${body}`}
function openSettings(tab){modal(settingsHTML(tab||'profile'))}
function profileTabHTML(){const av=S.pf.av||'red';
 return `<div class="sub" style="margin:10px 0 4px">Username</div>
<input id="sUn" maxlength="16" value="${esc(S.pf.name)}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit">
<div id="sUnm" class="sub" style="margin:4px 0 8px"></div>
<button class="mini" style="margin:0 0 14px" onclick="settingsChangeUsername()">Save username</button>
<div class="sub" style="margin:0 0 6px">Squirrel</div>
<div class="ag">${SQ.map(x=>`<button class="${x.id==av?'on':''}" onclick="settingsPickAv('${x.id}')">${sq(x,52)}${x.n.replace(' squirrel','')}</button>`).join('')}</div>
${user?`<div class="sub" style="margin:16px 0 6px">Account · signed in as ${esc(user.email||'')}</div>
<input id="sPw" type="password" placeholder="New password (6+ characters)" autocomplete="new-password" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit">
<button class="mini" style="margin:8px 0 0" onclick="settingsChangePassword()">Change password</button>
<input id="sEm" type="email" placeholder="New email address" autocomplete="email" style="width:100%;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit">
<button class="mini" style="margin:8px 0 0" onclick="settingsChangeEmail()">Change email</button>
<div id="sAm" class="sub" style="margin-top:8px"></div>`:`<div class="sub" style="margin-top:16px">Sign in to change your password or email.</div>`}
<div class="sub" style="margin-top:18px">🎨 Equip skins — unlock the Skin Market in Prestige, then equip owned skins from the Golden shop section. Choosing them here is coming soon.</div>`}
async function settingsChangeUsername(){const el=$('sUn'),n=el.value.trim().replace(/\s+/g,' ');
 if(n.length<2){el.focus();return}
 const nm=n.slice(0,16);$('sUnm').style.color='var(--mute)';$('sUnm').textContent='Checking availability…';
 if(sb){let q=sb.from('leaderboard').select('user_id').ilike('username',nm);if(user)q=q.neq('user_id',user.id);
  const r=await q.limit(1);
  if(!r.error&&r.data&&r.data.length){$('sUnm').style.color='var(--gold)';$('sUnm').textContent='That username is taken. Try another.';return}}
 S.pf.name=nm;$('sUnm').style.color='var(--acc)';$('sUnm').textContent='Saved!';profile();save();if(user)push()}
function settingsPickAv(id){S.pf.av=id;pick=id;profile();save();if(user)push();openSettings('profile')}
async function settingsChangePassword(){if(!sb||!user)return;const p=$('sPw').value;
 if(p.length<6){$('sAm').style.color='var(--gold)';$('sAm').textContent='Password must be 6+ characters.';return}
 $('sAm').style.color='var(--mute)';$('sAm').textContent='Updating…';
 const r=await sb.auth.updateUser({password:p});
 $('sAm').style.color=r.error?'var(--gold)':'var(--acc)';$('sAm').textContent=r.error?r.error.message:'Password updated.';if(!r.error)$('sPw').value=''}
async function settingsChangeEmail(){if(!sb||!user)return;const e=$('sEm').value.trim();
 if(!e){$('sAm').style.color='var(--gold)';$('sAm').textContent='Enter a new email.';return}
 $('sAm').style.color='var(--mute)';$('sAm').textContent='Updating…';
 const r=await sb.auth.updateUser({email:e});
 $('sAm').style.color=r.error?'var(--gold)':'var(--acc)';$('sAm').textContent=r.error?r.error.message:'Check your new email to confirm the change.';if(!r.error)$('sEm').value=''}
function audioTabHTML(){return `<div class="sub" style="margin:10px 0 8px">Background sound</div>
<div class="snd" style="justify-content:flex-start;gap:12px;margin:0">
<button id="mb" onclick="music()" aria-label="Toggle music">${S.mus?'🔊':'🔇'}</button>
<input type="range" id="vol" min="0" max="100" value="${S.vol}" oninput="setVol(this.value)" aria-label="Volume" style="width:150px">
</div>`}
function gameplayTabHTML(){const cur=S.theme||'system';
 const opt=(v,l)=>`<button class="mini${cur==v?' on':''}" style="margin:0 6px 0 0" onclick="setTheme('${v}')">${l}</button>`;
 return `<div class="sub" style="margin:10px 0 8px">Background colours</div>
<div>${opt('system','Auto')}${opt('light','Light')}${opt('dark','Dark')}</div>
<div class="sub" style="margin-top:18px">🎨 More themes — unlockable and purchasable colour palettes are coming soon.</div>`}

 S=def();if(AX)AX.suspend();sndUI();save();if(user)push();armed=0;b.textContent='Reset save';document.documentElement.dataset.skin='';delete document.documentElement.dataset.theme;lists();ui();toast('Save erased. Fresh start!')}
document.documentElement.dataset.skin=S.skin||'';if(S.theme)document.documentElement.dataset.theme=S.theme;
$('la').innerHTML=AC()+' Acorns';$('lg').innerHTML=AC(1)+' Golden';
profile();if(!S.pf.name)openProfile(1);else if(S.lastVer&&S.lastVer!==CHANGELOG[0].v)showChangelog(0);else if(!S.lastVer){S.lastVer=CHANGELOG[0].v;save()}
lists();applyCol();ui();loadLB();setInterval(ui,1000);setInterval(save,5000);cloudInit();setInterval(()=>{if(user&&!document.hidden&&$('ov2').hidden)cloudSync()},60000);loadAnn();setInterval(loadAnn,120000);
