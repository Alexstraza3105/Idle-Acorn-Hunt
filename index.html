async function sendFeedback(){const t=$('fbType').value,m=$('fbMsg').value.trim();

async function settingsChangeUsername(){const el=$('sUn'),n=el.value.trim().replace(/\s+/g,' ');
 if(n.length<2){el.focus();return}
 const nm=n.slice(0,16);$('sUnm').style.color='var(--mute)';$('sUnm').textContent='Checking availability…';
 if(sb){let q=sb.from('leaderboard').select('user_id').ilike('username',nm);if(user)q=q.neq('user_id',user.id);
  const r=await q.limit(1);
  if(!r.error&&r.data&&r.data.length){$('sUnm').style.color='var(--gold)';$('sUnm').textContent='That username is taken. Try another.';return}}
 S.pf.name=nm;$('sUnm').style.color='var(--acc)';$('sUnm').textContent='Saved!';profile();save();if(user)push()}
function settingsPickAv(id){S.pf.av=id;pick=id;profile();save();if(user)push();openSettings('profile')}

 const r=await sb.auth.updateUser({password:p});
 $('sAm').style.color=r.error?'var(--gold)':'var(--acc)';$('sAm').textContent=r.error?r.error.message:'Password updated.';if(!r.error)$('sPw').value=''}
async function settingsChangeEmail(){if(!sb||!user)return;const e=$('sEm').value.trim();
 if(!e){$('sAm').style.color='var(--gold)';$('sAm').textContent='Enter a new email.';return}
 $('sAm').style.color='var(--mute)';$('sAm').textContent='Updating…';
 const r=await sb.auth.updateUser({email:e});
 $('sAm').style.color=r.error?'var(--gold)':'var(--acc)';$('sAm').textContent=r.error?r.error.message:'Check your new email to confirm the change.';if(!r.error)$('sEm').value=''}

const TW='<svg viewBox="0 0 24 24" width="1.1em" height="1.1em" style="vertical-align:-.2em" aria-hidden="true"><path d="M4 20 L18 6" stroke="#8a6a43" stroke-width="2.6" stroke-linecap="round"/><path d="M9 15l-4 1M13 11l-3.5 3.5M16 8l-3 1" stroke="#6b4f30" stroke-width="1.8" stroke-linecap="round"/></svg>';
const JP_A=AC(),JP_G=AC(1),JP_T=TW;

const JP_B='🦇';
const JP_TIERS=[
 {p:.4,label:'Nothing this time',g:0,a:0,syms:()=>{const o=Math.random()<.5?JP_A:JP_G;return shuf([JP_T,JP_T,o])}},
 {p:.4,label:'+500 acorns',g:0,a:500,syms:()=>shuf([JP_A,JP_A,JP_T])},
 {p:.12,label:'+5,000 acorns',g:0,a:5000,syms:()=>[JP_A,JP_A,JP_A]},
 {p:.06,label:'+2 golden acorns',g:2,a:0,syms:()=>shuf([JP_G,JP_G,JP_A])},
 {p:.02,label:'JACKPOT! +5 golden acorns',g:5,a:0,jackpot:true,syms:()=>[JP_G,JP_G,JP_G]}
];
const HAL_JP_TIERS=[
 {p:.37,label:'Nothing this time',a:0,g:0,b:0,syms:()=>shuf([JP_T,JP_T,Math.random()<.5?JP_A:JP_G])},
 {p:.40,label:'+750 acorns',a:750,g:0,b:0,syms:()=>shuf([JP_A,JP_A,JP_T])},
 {p:.12,label:'+7,500 acorns',a:7500,g:0,b:0,syms:()=>[JP_A,JP_A,JP_A]},
 {p:.06,label:'+3 golden acorns',a:0,g:3,b:0,syms:()=>[JP_G,JP_G,JP_A]},
 {p:.03,label:'+50 Chocolate Bats',a:0,g:0,b:50,syms:()=>[JP_B,JP_B,JP_B]},
 {p:.02,label:'JACKPOT! +7 golden acorns',a:0,g:Math.floor(5*1.5),b:0,jackpot:true,syms:()=>[JP_G,JP_G,JP_G]}
];
function pickJpTier(tiers){let r=Math.random(),acc=0;for(const t of tiers){acc+=t.p;if(r<acc)return t}return tiers[0]}
function halloweenJpTierPick(){return pickJpTier(HAL_JP_TIERS)}
const JP_COST=1000;
function jpTierPick(){let r=Math.random(),acc=0;for(const t of JP_TIERS){acc+=t.p;if(r<acc)return t}return JP_TIERS[0]}
function jackpotHTML(){const fs=S.freeSpins||0,cd=S.T.hunts%10,hal=halloweenActive();return `<h2 style="margin-top:0">🎰 Acorn Jackpot</h2>

${hal?'<div class="sub" id="halloweenShopCountdown">'+halloweenCountdownText()+'</div>':''}

<div class="jptable">${hal?`<div><span>${JP_G}${JP_G}${JP_G}</span><b>2% · Jackpot: 7 golden acorns</b></div><div><span>${JP_B}${JP_B}${JP_B}</span><b>3% · 50 Chocolate Bats</b></div><div><span>${JP_G}${JP_G}${JP_A}</span><b>6% · 3 golden acorns</b></div><div><span>${JP_A}${JP_A}${JP_A}</span><b>12% · 7,500 acorns</b></div><div><span>${JP_A}${JP_A}·</span><b>40% · 750 acorns</b></div><div><span>${JP_T}${JP_T}·</span><b>37% · Nothing</b></div>`:`<div><span>${JP_G}${JP_G}${JP_G}</span><b>5 golden acorns</b></div><div><span>${JP_G}${JP_G}·</span><b>2 golden acorns</b></div><div><span>${JP_A}${JP_A}${JP_A}</span><b>5,000 acorns</b></div><div><span>${JP_A}${JP_A}·</span><b>500 acorns</b></div><div><span>${JP_T}${JP_T}·</span><b>Nothing</b></div>`}</div>`}
const HAL_ITEMS=[
 {id:'oak',e:'🌳',n:'Oak Charm',effect:'+5% harvest yield per stack',value:n=>'+'+(5*n)+'% harvest yield'},
 {id:'feather',e:'🪶',n:"Hunter's Feather",effect:'+5% acorns per hunt per stack',value:n=>'+'+(5*n)+'% acorns per hunt'},

 {id:'satchel',e:'🧺',n:'Seed Satchel',effect:'+1% seed drop chance per stack',value:n=>'+'+n+'% seed drop chance'}

function halloweenShopHTML(){return `<h2 style="margin-top:0">🎃 Halloween Shop</h2><div class="sub">🦇 Chocolate Bats: <b>${fmt(S.halloween.bats)}</b></div><div class="sub" id="halloweenShopCountdown" style="margin:4px 0 12px">${halloweenCountdownText()}</div>${HAL_ITEMS.map(x=>{const n=S.halloween.upgrades[x.id]||0;return `<button class="it" onclick="buyHalloween('${x.id}')" ${S.halloween.bats<150?'disabled':''}><span class="em">${x.e}</span><span class="tx"><b>${x.n}</b> · ${n} stack${n===1?'':'s'}<small>${x.effect}<br>Current: ${x.value(n)}</small></span><span class="pr">🦇 150</span></button>`}).join('')}`};

 const free=S.freeSpins>0;
 if(!free&&S.a<JP_COST){$('jpm').style.color='var(--gold)';$('jpm').textContent='Not enough acorns.';return}
 jpSpinning=true;$('jps').disabled=true;$('jpm').style.color='var(--mute)';$('jpm').textContent='Spinning…';
 if(free)S.freeSpins--;else S.a-=JP_COST;
 S.T.spins++;
 const jpsEl=$('jps'),jpfsEl=$('jpfs'),fsNow=S.freeSpins||0;
 if(jpsEl)jpsEl.innerHTML=fsNow>0?'Spin (Free)':'Spin ('+JP_COST+' '+AC()+')';
 if(jpfsEl)jpfsEl.textContent=JP_COST+' acorns per spin'+(fsNow?' · '+fsNow+' free spin'+(fsNow>1?'s':'')+' banked':'');
 save();ui();
 let halMode=halloweenActive(),tier=halMode?halloweenJpTierPick():jpTierPick(),final=tier.syms();const pool=[JP_A,JP_G,JP_T];
 let n=0;const spin=setInterval(()=>{
  for(let i=0;i<3;i++)$('r'+i).textContent!==undefined&&($('r'+i).innerHTML=pool[Math.floor(Math.random()*3)]);

   [0,1,2].forEach((i,idx)=>setTimeout(()=>{const el=$('r'+i);if(el)el.innerHTML=final[i]},idx*220));
   setTimeout(()=>{
    if(halMode!==halloweenActive()){halMode=halloweenActive();tier=halMode?halloweenJpTierPick():jpTierPick();final=tier.syms();[0,1,2].forEach(i=>{const el=$('r'+i);if(el)el.innerHTML=final[i]})}

    if(tier.jackpot||tier.g===5)S.T.jackpots++;
    $('jpm').style.color=tier.p<=.02?'var(--gold)':tier.a||tier.g?'var(--acc)':'var(--mute)';
    $('jpm').textContent=tier.label;
    save();lists();ui();jpSpinning=false;$('jps').disabled=false
   },3*220+150)}
 },90)}

 S=def();if(AX)AX.suspend();sndUI();save();if(user)push();armed=0;b.textContent='Reset save';document.documentElement.dataset.skin='';delete document.documentElement.dataset.theme;lists();ui();toast('Save erased. Fresh start!')}
